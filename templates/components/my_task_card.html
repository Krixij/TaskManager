<article
  class="task-card task-card--my-task task-card--collapsible {% if expanded %}is-expanded{% else %}is-collapsed{% endif %}"
  data-task-card="{{ task.pk }}"
>
  <div class="task-card__summary">
    <h3 class="task-card__title">
      {{ task.title }}
    </h3>

    <button
      class="icon-toggle task-card__toggle {% if expanded %}is-expanded{% endif %}"
      type="button"
      data-toggle-task="{{ task.pk }}"
      aria-label="{% if expanded %}Скрыть описание задачи{% else %}Показать описание задачи{% endif %}"
      aria-expanded="{% if expanded %}true{% else %}false{% endif %}"
    >
      {% include 'components/chevron_icon.html' %}
    </button>
  </div>

  <div class="task-card__description">
    {{ task.description }}
  </div>
</article>
