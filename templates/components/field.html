<label class="form-field" for="{{ field.id_for_label }}">
  <span class="form-field__label">
    {{ field.label }}

    {% if field.field.required %}
      <span class="required">*</span>
    {% endif %}
  </span>

  {{ field }}

  {% if field.help_text %}
    <span class="form-field__help">
      {{ field.help_text }}
    </span>
  {% endif %}

  {% if field.errors %}
    <span class="form-field__error">
      {{ field.errors|striptags }}
    </span>
  {% endif %}
</label>
