<div
  class="modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-title"
  hidden
>
  <div class="modal__dialog">
    <div class="modal__header">
      <h2 class="modal__title" id="modal-title"></h2>

      <button
        class="modal__close"
        type="button"
        aria-label="Закрыть окно"
      >
        ×
      </button>
    </div>

    <div class="modal__body"></div>
  </div>
</div>
